<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Chat with us · Aquatic Paradise Rentals</title>
<meta name="description" content="Chat with the Aquatic Paradise Rentals team in Bequia: gear, prices, delivery and bookings."/>
<link rel="icon" type="image/png" sizes="48x48" href="/icons/icon-48.png"/>
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png"/>
<link rel="apple-touch-icon" href="/icons/icon-180.png"/>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#0B1E33"/>
<style>
@import url('fonts/fonts.css');
/* Same palette as index.html (booking page). */
:root{
  --navy:#0B1E33; --teal:#0E7C90; --teal-ink:#0A5F70; --coral:#D63A3A; --amber:#C9820A;
  --ink:#101828; --muted:#5D6779; --line:#E4E7EC; --light:#F4F6F8; --card:#FFFFFF;
  --sand:#F6EEDC; --sand-line:#E7D6B0; --sand-ink:#6B5220;
  --me:#0E7C90; --me-ink:#FFFFFF;
  --radius:14px;
  --display:'Fraunces',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --navy:#070E1A; --teal:#4FB8CC; --teal-ink:#7FD1E0; --coral:#F0655F; --amber:#F0A93B;
    --ink:#E7EBF3; --muted:#9AA6BA; --line:#232E44; --light:#0B1220; --card:#111A2C;
    --sand:#1F1A10; --sand-line:#3A3020; --sand-ink:#E9CF97;
    --me:#4FB8CC; --me-ink:#04222A;
  }
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',-apple-system,'Segoe UI',Helvetica,sans-serif;color:var(--ink);background:#0B1E33;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:url('hero.jpg') center 35%/cover no-repeat}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:rgba(7,20,36,.78)}
::selection{background:rgba(14,124,144,.25)}
a{color:var(--teal-ink)}
button{font:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

/* Shell: full screen on phones, a centered window on wide screens */
.shell{height:100dvh;max-width:760px;margin:0 auto;display:flex;flex-direction:column;background:var(--light)}
@media (min-width:800px){.shell{height:calc(100dvh - 48px);margin:24px auto;border-radius:16px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.35)}}

/* Header */
.top{display:flex;align-items:center;gap:12px;padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top));background:var(--navy);color:#fff;flex-shrink:0}
.icon-btn{width:40px;height:40px;border-radius:10px;border:none;background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer;text-decoration:none;flex-shrink:0}
.icon-btn:hover{background:rgba(255,255,255,.08)}
.top-logo{width:40px;height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.15);flex-shrink:0}
.top-text{min-width:0;flex:1}
.top-text h1{font-family:var(--display);font-weight:600;font-size:1.08rem;letter-spacing:-.01em;line-height:1.2}
.status{display:flex;align-items:center;gap:6px;font-size:.78rem;color:rgba(255,255,255,.72);margin-top:2px}
.status i{width:8px;height:8px;border-radius:50%;background:#34C77B;flex-shrink:0}
.status.away i{background:#F0A93B}

/* Menu */
.menu{position:absolute;right:12px;top:62px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px;min-width:230px;z-index:20;display:none}
.menu.open{display:block}
.menu a,.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:none;background:none;border-radius:8px;color:var(--ink);text-decoration:none;font-size:.88rem;text-align:left;cursor:pointer}
.menu a:hover,.menu button:hover{background:var(--light)}
.menu .danger{color:var(--coral)}
.menu svg{flex-shrink:0;color:var(--muted)}
.menu .danger svg{color:var(--coral)}

/* Messages */
.log{flex:1;overflow-y:auto;padding:18px 14px 10px;display:flex;flex-direction:column;gap:4px;overscroll-behavior:contain}
.day{align-self:center;font-size:.72rem;font-weight:600;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:3px 10px;margin:10px 0 6px}
.row{display:flex;flex-direction:column;max-width:82%}
.row.them{align-self:flex-start}
.row.me{align-self:flex-end;align-items:flex-end}
.row + .row.same{margin-top:-1px}
.who{font-size:.74rem;font-weight:600;color:var(--muted);margin:8px 4px 3px}
.bubble{padding:9px 13px;border-radius:var(--radius);font-size:.94rem;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.them .bubble{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.me .bubble{background:var(--me);color:var(--me-ink);border-bottom-right-radius:4px}
.me .bubble a{color:inherit}
.auto .bubble{background:var(--sand);border:1px solid var(--sand-line);color:var(--ink)}
.auto .who{color:var(--sand-ink)}
.meta{font-size:.7rem;color:var(--muted);margin:3px 6px 0;font-variant-numeric:tabular-nums}
.failed .bubble{background:transparent;color:var(--coral);border:1px dashed var(--coral);cursor:pointer}
.note{align-self:center;text-align:center;font-size:.8rem;color:var(--muted);max-width:420px;margin:10px auto;line-height:1.5}

/* Welcome */
.welcome{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:4px 0 8px}
.welcome h2{font-family:var(--display);font-weight:600;font-size:1.25rem;letter-spacing:-.01em;margin-bottom:6px}
.welcome p{font-size:.9rem;line-height:1.55;color:var(--muted)}
.wa{display:flex;align-items:center;gap:10px;margin-top:14px;padding:11px 14px;border-radius:10px;background:#157A41;color:#fff;text-decoration:none;font-weight:600;font-size:.9rem}
.wa small{display:block;font-weight:400;font-size:.76rem;opacity:.9}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:8px 13px;font-size:.84rem;cursor:pointer}
.chip:hover{border-color:var(--teal);color:var(--teal-ink)}

/* Composer */
.compose{flex-shrink:0;background:var(--card);border-top:1px solid var(--line);padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.who-form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.who-form label{display:block;font-size:.74rem;font-weight:600;color:var(--muted);margin-bottom:4px}
.field{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--light);color:var(--ink);font:inherit;font-size:.92rem}
.field:focus{outline:none;border-color:var(--teal)}
.bar{display:flex;align-items:flex-end;gap:8px}
.bar textarea{flex:1;resize:none;min-height:44px;max-height:140px;padding:11px 14px;border:1px solid var(--line);border-radius:22px;background:var(--light);color:var(--ink);font:inherit;font-size:.95rem;line-height:1.4}
.bar textarea:focus{outline:none;border-color:var(--teal)}
.send{width:44px;height:44px;border-radius:50%;border:none;background:var(--me);color:var(--me-ink);display:grid;place-items:center;cursor:pointer;flex-shrink:0}
.send:disabled{opacity:.45;cursor:default}
.fine{font-size:.72rem;color:var(--muted);margin-top:8px;line-height:1.45}
.fine a{color:var(--muted)}
.who-form[hidden]{display:none}
@media (max-width:420px){.who-form{grid-template-columns:1fr}}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:.85rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90vw;text-align:center}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <a class="icon-btn" href="index.html" aria-label="Back to booking">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <img class="top-logo" src="logo.jpg" alt=""/>
    <div class="top-text">
      <h1>Aquatic Paradise Team</h1>
      <div class="status" id="status"><i></i><span id="statusText">On the beach now · usually reply in minutes</span></div>
    </div>
    <button class="icon-btn" id="menuBtn" aria-label="More options" aria-haspopup="true" aria-expanded="false" onclick="toggleMenu()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
    </button>
    <div class="menu" id="menu" role="menu">
      <a role="menuitem" href="https://wa.me/17844963447?text=Hi%20Aquatic%20Paradise!%20" target="_blank" rel="noopener">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
        Continue on WhatsApp</a>
      <a role="menuitem" href="index.html#book">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        Book gear</a>
      <a role="menuitem" href="privacy.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Privacy &amp; cookies</a>
      <button role="menuitem" class="danger" onclick="deleteChat()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
        Delete this chat</button>
    </div>
  </header>

  <main class="log" id="log" aria-live="polite"></main>

  <form class="compose" id="compose" onsubmit="event.preventDefault();sendChat()">
    <div class="who-form" id="whoForm" hidden>
      <div><label for="chatName">Your name</label><input class="field" id="chatName" maxlength="60" autocomplete="given-name" placeholder="e.g. Sarah" required/></div>
      <div><label for="chatContact">WhatsApp (optional)</label><input class="field" id="chatContact" maxlength="40" type="tel" autocomplete="tel" placeholder="In case you leave the page"/></div>
    </div>
    <div class="bar">
      <textarea id="chatInput" rows="1" maxlength="1000" placeholder="Message the team…" aria-label="Message"></textarea>
      <button class="send" id="sendBtn" type="submit" aria-label="Send">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4Z"/></svg>
      </button>
    </div>
    <p class="fine" id="fine">Our team reads these messages on their phones. Please don't send card numbers or passwords. Chats are kept for up to 6 months — <a href="privacy.html">privacy notice</a>.</p>
  </form>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const BACKEND = 'https://script.google.com/macros/s/AKfycbzr1KHela518-pgQ3dJyvv77tm9z2JWo_TTovRNys6RwYNBIUfdyJKxGF_ETzNk9m47Ww/exec';
// Same storage key as the chat bubble on index.html, so both show one conversation.
// Stored on this device only (strictly necessary for the chat to work — see privacy.html).
const CHAT_KEY = 'apr_chat';
let chat = (() => { try { return JSON.parse(localStorage.getItem(CHAT_KEY)) || {}; } catch (e) { return {}; } })();
let sending = false, pollTimer = null, fastUntil = 0;
const QUICK = ['How much is a paddle board?', 'Can you deliver to my villa?', 'Is it OK for beginners?', 'Do you have kids\' life jackets?', 'What if the weather is bad?'];

const $ = id => document.getElementById(id);
function save() { try { localStorage.setItem(CHAT_KEY, JSON.stringify(chat)); } catch (e) {} }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
// Escaped first, then only plain web addresses become links.
function linkify(s) {
  return esc(s).replace(/\b((?:https?:\/\/)?(?:aquaticparadiserental\.vacations|wa\.me)\/[^\s<]*|https:\/\/[^\s<]+)/g, u => {
    const href = /^https?:/.test(u) ? u : 'https://' + u;
    return `<a href="${href}" target="_blank" rel="noopener">${u}</a>`;
  });
}
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 3200); }
function convoId() {
  if (!chat.convo) {
    const a = new Uint8Array(16); crypto.getRandomValues(a);
    chat.convo = Array.from(a, b => b.toString(16).padStart(2, '0')).join(''); save();
  }
  return chat.convo;
}
async function call(body) {
  const res = await fetch(BACKEND, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), signal: AbortSignal.timeout(15000) });
  return res.json();
}
function openNow() {
  const h = Number(new Date().toLocaleString('en-US', { timeZone: 'America/St_Vincent', hour: 'numeric', hour12: false }));
  return h >= 8 && h < 18;
}
function timeOf(iso) { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
function dayOf(iso) {
  const d = new Date(iso); if (isNaN(d)) return '';
  const today = new Date(); const y = new Date(Date.now() - 86400000);
  if (d.toDateString() === today.toDateString()) return 'Today';
  if (d.toDateString() === y.toDateString()) return 'Yesterday';
  return d.toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' });
}

function renderStatus() {
  const open = openNow();
  $('status').classList.toggle('away', !open);
  $('statusText').textContent = open ? 'On the beach now · usually reply in minutes' : 'Off the water · we reply from 8AM (Bequia time)';
}

function render() {
  const msgs = chat.msgs || [];
  let html = '';
  if (!msgs.length) {
    html += `<section class="welcome">
      <h2>Hi, how can we help?</h2>
      <p>Ask about gear, prices, delivery to your beach, villa or boat, or your booking. Common questions get an instant answer, and a real person from our Bequia team follows up here.</p>
      <a class="wa" href="https://wa.me/17844963447?text=${encodeURIComponent('Hi Aquatic Paradise! ')}" target="_blank" rel="noopener">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
        <span>Prefer WhatsApp?<small>Opens your WhatsApp with our number</small></span></a>
    </section>
    <div class="chips">${QUICK.map(q => `<button type="button" class="chip" onclick="prefill(this.textContent)">${esc(q)}</button>`).join('')}</div>`;
  }
  let lastDay = '', lastWho = '';
  msgs.forEach((m, i) => {
    const day = dayOf(m.at || new Date().toISOString());
    if (day && day !== lastDay) { html += `<div class="day">${day}</div>`; lastDay = day; lastWho = ''; }
    const mine = m.from === 'guest';
    const auto = m.from === 'auto';
    const who = mine ? 'me' : auto ? 'auto' : (m.name || 'team');
    const showName = !mine && who !== lastWho;
    lastWho = who;
    if (m.failed) {
      html += `<div class="row me failed"><div class="bubble" role="button" tabindex="0" onclick="retry(${i})">${esc(m.text)}</div><div class="meta">Not sent · tap to retry</div></div>`;
      return;
    }
    html += `<div class="row ${mine ? 'me' : 'them'}${auto ? ' auto' : ''}">` +
      (showName ? `<div class="who">${auto ? 'Automatic answer' : esc(m.name || 'Aquatic Paradise')}</div>` : '') +
      `<div class="bubble">${linkify(m.text)}</div>` +
      `<div class="meta">${m.pending ? 'Sending…' : timeOf(m.at)}</div></div>`;
  });
  const sent = msgs.some(m => m.from === 'guest' && !m.failed && !m.pending);
  const answered = msgs.some(m => m.from === 'team');
  if (sent && !answered) html += `<p class="note">Sent to the team's phones. ${openNow() ? 'We usually reply within a few minutes.' : 'We\'re off the water now and reply from 8AM.'} You can leave this page and come back — the conversation stays on this device.</p>`;
  const log = $('log');
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
  log.innerHTML = html;
  if (msgs.length && (atBottom || render.first !== false)) log.scrollTop = log.scrollHeight;
  render.first = false;
  $('whoForm').hidden = !!chat.name;
  chat.seenTeam = msgs.filter(m => m.from !== 'guest').length; save();
}

function prefill(text) { const ta = $('chatInput'); ta.value = text; grow(); ta.focus(); }
function grow() { const ta = $('chatInput'); ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 140) + 'px'; }

function apply(serverMsgs) {
  const unsent = (chat.msgs || []).filter(m => m.failed);
  chat.msgs = (serverMsgs || []).concat(unsent);
  save(); render();
}

async function sendChat(retryText) {
  if (sending) return;
  const ta = $('chatInput');
  const text = (retryText || ta.value).trim();
  if (!text) { ta.focus(); return; }
  if (!chat.name) {
    const name = $('chatName').value.trim();
    if (!name) { toast('Please add your name first'); $('chatName').focus(); return; }
    chat.name = name; chat.contact = $('chatContact').value.trim(); save();
  }
  if (!retryText) { ta.value = ''; grow(); }
  sending = true; $('sendBtn').disabled = true;
  const pending = { from: 'guest', text, at: new Date().toISOString(), pending: true };
  chat.msgs = (chat.msgs || []).concat(pending); render();
  $('log').scrollTop = $('log').scrollHeight;
  try {
    const d = await call({ action: 'chatSend', convo: convoId(), name: chat.name, contact: chat.contact || '', text });
    if (!d || !d.ok) throw new Error((d && d.error) || 'Not sent');
    chat.msgs = chat.msgs.filter(m => m !== pending);
    apply(d.messages);
    fastUntil = Date.now() + 5 * 60000;
  } catch (err) {
    pending.pending = false; pending.failed = true; save(); render();
    toast(err.message && !/fetch|abort|timeout|network/i.test(err.message) ? err.message : 'No connection — tap the message to retry, or use WhatsApp');
  } finally {
    sending = false; $('sendBtn').disabled = false; schedule();
  }
}
function retry(i) { const m = (chat.msgs || [])[i]; if (!m || !m.failed) return; chat.msgs.splice(i, 1); sendChat(m.text); }

async function poll() {
  if (!chat.convo || !(chat.msgs || []).some(m => !m.failed && !m.pending)) return;
  try { const d = await call({ action: 'chatFetch', convo: chat.convo }); if (d && d.ok) apply(d.messages); } catch (e) {}
}
function schedule() {
  clearTimeout(pollTimer);
  if (!chat.convo || !(chat.msgs || []).length) return;
  pollTimer = setTimeout(async () => { if (!document.hidden) await poll(); schedule(); }, Date.now() < fastUntil ? 5000 : 15000);
}

async function deleteChat() {
  toggleMenu(false);
  if (!chat.convo || !(chat.msgs || []).length) { toast('There\'s no chat to delete'); return; }
  if (!confirm('Delete this whole conversation? It is removed from our records and from this device. This can\'t be undone.')) return;
  try {
    const d = await call({ action: 'chatDelete', convo: chat.convo });
    if (!d || !d.ok) throw new Error((d && d.error) || 'Could not delete');
  } catch (err) { toast('Could not reach us — try again when you\'re online'); return; }
  chat = {}; try { localStorage.removeItem(CHAT_KEY); } catch (e) {}
  clearTimeout(pollTimer); render(); toast('Chat deleted');
}

function toggleMenu(force) {
  const open = typeof force === 'boolean' ? force : !$('menu').classList.contains('open');
  $('menu').classList.toggle('open', open);
  $('menuBtn').setAttribute('aria-expanded', open);
}
document.addEventListener('click', e => { if (!e.target.closest('#menu, #menuBtn')) toggleMenu(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') toggleMenu(false); });
$('chatInput').addEventListener('input', grow);
$('chatInput').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !matchMedia('(pointer:coarse)').matches) { e.preventDefault(); sendChat(); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { renderStatus(); poll(); } });
window.addEventListener('storage', e => { if (e.key === CHAT_KEY) { try { chat = JSON.parse(e.newValue) || {}; } catch (x) { chat = {}; } render(); } });

renderStatus(); render(); poll(); schedule();
setInterval(renderStatus, 60000);
</script>
</body>
</html>
